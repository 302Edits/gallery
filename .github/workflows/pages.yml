name: Publish gallery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm/cli#4828 can omit a platform-specific optional dependency when the
      # lockfile was created on macOS. Pin the binding used by Vite on this runner.
      - run: npm install --no-save --ignore-scripts @rolldown/binding-linux-x64-gnu@1.2.6 lightningcss-linux-x64-gnu@1.32.0 @tailwindcss/oxide-linux-x64-gnu@4.3.3 --workspace frontend
      - name: Test backend and gallery adapter
        run: npm test
      - name: Refresh from Zonerama
        run: npm run snapshot:zonerama
      - name: Reject blocked or unsafe Zonerama images
        env:
          ZONERAMA_VERIFY_REFERRER: https://302edits.github.io/${{ github.event.repository.name }}/
        run: npm run verify:zonerama
      - name: Build GitHub Pages site
        env:
          VITE_PUBLIC_STATIC: 'true'
          VITE_STATIC_ZONERAMA: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Check the photo viewer fallback
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser -- --grep "unavailable preview links"
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist-public
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

