name: Publish gallery

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm/cli#4828 can omit a platform-specific optional dependency when the
      # lockfile was created on macOS. Pin the binding used by Vite on this runner.
      - run: npm install --no-save --ignore-scripts @rolldown/binding-linux-x64-gnu@1.2.6 @oxlint/binding-linux-x64-gnu@1.81.0 lightningcss-linux-x64-gnu@1.32.0 @tailwindcss/oxide-linux-x64-gnu@4.3.3 --workspace frontend
      - name: Test backend and gallery adapter
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Refresh from Zonerama
        run: npm run snapshot:zonerama
      - name: Reject blocked or unsafe Zonerama images
        env:
          ZONERAMA_VERIFY_REFERRER: https://302edits.github.io/${{ github.event.repository.name }}/
        run: npm run verify:zonerama
      - name: Build GitHub Pages site
        env:
          VITE_PUBLIC_STATIC: 'true'
          VITE_STATIC_ZONERAMA: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

